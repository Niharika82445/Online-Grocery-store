<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshCart - Sign Up</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            🛒 FreshCart
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="user.html">Shop</a>
            <a href="signup.html">Sign Up</a>
            <a href="admin.html">Admin</a>
        </nav>

    </header>


    <!-- SIGNUP SECTION -->
    <section class="auth-section">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p>Join FreshCart and start shopping!</p>

            <form id="signupForm">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>


                <button type="submit" class="auth-btn">
                    Create Account
                </button>

            </form>


            <p class="auth-link">
                Already have an account?
                <a href="user.html">Login here</a>
            </p>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>

        <h3>🛒 FreshCart</h3>

        <p>
            Your simple and convenient online grocery store.
        </p>

        <p>
            © 2026 FreshCart | Online Grocery Store
        </p>

    </footer>


    <!-- AUTH JAVASCRIPT -->
    <script src="js/auth.js"></script>

</body>
</html>
